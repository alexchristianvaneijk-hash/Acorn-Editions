<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acorn Editions</title>
  <style>
    /* ---------- BASE STYLES ---------- */
    body {
      margin: 0;
      font-family: "Georgia", serif;
      background-color: #fdfcf9;
      color: #222;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      text-align: center;
      padding: 4rem 1rem 3rem;
    }

    header h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2.8rem;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      color: #555;
    }

    nav {
      text-align: center;
      padding: 1rem 0;
      border-top: 1px solid #e0dfdb;
      border-bottom: 1px solid #e0dfdb;
      background-color: #f8f7f3;
    }

    nav a {
      margin: 0 1.5rem;
      font-size: 1rem;
      color: #444;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #b86b36;
    }

    /* ---------- SECTION HEADINGS ---------- */
    .section-header {
      text-align: center;
      margin-top: 3rem;
      margin-bottom: 1rem;
    }

    .section-header h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
      color: #222;
    }

    .section-header p {
      color: #666;
      font-size: 0.95rem;
    }

    /* ---------- CAROUSEL ---------- */
    .carousel-small {
      position: relative;
      overflow: hidden;
      max-width: 1200px;
      margin: 2rem auto 3rem auto;
      border-radius: 10px;
      cursor: grab; /* ✳️ for desktop drag */
    }

    .carousel-track-small {
      display: flex;
      gap: 1.2rem;
      scroll-behavior: smooth;
      overflow-x: auto;
      scrollbar-width: none; /* hide scrollbar */
    }

    .carousel-track-small::-webkit-scrollbar {
      display: none;
    }

    /* ---------- FEATURE CARD ---------- */
    .feature-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex: 0 0 180px;
      text-align: center;
      padding-bottom: 1rem;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* ✳️ Hover animation */
    .feature-card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    .feature-card:hover .download-btn {
      background: #e0ded9;
      border-color: #999;
    }

    .cover-wrapper {
      position: relative;
    }

    .cover-wrapper img {
      width: 100%;
      height: auto;
      border-bottom: 1px solid #eee;
      border-radius: 8px 8px 0 0;
    }

    .book-type {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(255,255,255,0.7);
      color: #333;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      border: 1px solid #ddd;
    }

    .feature-card h4 {
      margin: 0.8rem 0 0.3rem;
      font-size: 1rem;
    }

    .feature-card p {
      font-size: 0.85rem;
      color: #555;
      padding: 0 0.6rem;
      margin-bottom: 0.5rem;
    }

    /* ---------- DOWNLOAD BUTTONS ---------- */
    .download-buttons {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .download-btn {
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      border: 1px solid #ccc;
      background: #f7f6f3;
      color: #333;
      transition: all 0.2s ease;
    }

    .download-btn:hover {
      background: #e8e7e3;
      border-color: #aaa;
    }

    /* ---------- BIG SIDE ARROWS ---------- */
    .carousel-btn {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      background: rgba(255,255,255,0.8);
      border: none;
      font-size: 2rem;
      cursor: pointer;
      transition: background 0.2s ease;
      z-index: 5;
    }

    .carousel-btn:hover {
      background: rgba(255,255,255,0.95);
    }

    .prev { left: 0; border-radius: 10px 0 0 10px; }
    .next { right: 0; border-radius: 0 10px 10px 0; }

    /* ---------- COLLECTIONS SECTION ---------- */
    .collections {
      display: flex;
      justify-content: center;
      gap: 2rem;
      max-width: 1000px;
      margin: 3rem auto;
      flex-wrap: wrap;
    }

    .collection-card {
      flex: 1 1 280px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .collection-card:hover {
      transform: translateY(-4px);
    }

    .collection-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .collection-card h3 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.3rem;
      margin: 1rem 0 0.5rem;
    }

    .collection-card p {
      color: #555;
      font-size: 0.9rem;
      padding: 0 1rem 1.5rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #777;
      border-top: 1px solid #e0dfdb;
      margin-top: 3rem;
    }
  </style>
</head>

<body>
  <!-- (your body content stays exactly as it is) -->

  <footer>
    © Acorn Editions · Curated public domain literature for the modern reader.
  </footer>

  <!-- ✳️ UPDATED JS: Smooth drag + swipe + arrow controls -->
  <script>
    document.querySelectorAll('.carousel-small').forEach(section => {
      const track = section.querySelector('.carousel-track-small');
      const prev = section.querySelector('.prev');
      const next = section.querySelector('.next');

      // ---- Arrow click scroll ----
      prev.addEventListener('click', () => {
        track.scrollBy({ left: -300, behavior: 'smooth' });
      });

      next.addEventListener('click', () => {
        track.scrollBy({ left: 300, behavior: 'smooth' });
      });

      // ---- Drag / swipe scrolling ----
      let isDown = false;
      let startX;
      let scrollLeft;

      track.addEventListener('mousedown', e => {
        isDown = true;
        track.classList.add('active');
        startX = e.pageX - track.offsetLeft;
        scrollLeft = track.scrollLeft;
      });

      track.addEventListener('mouseleave', () => { isDown = false; });
      track.addEventListener('mouseup', () => { isDown = false; });
      track.addEventListener('mousemove', e => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - track.offsetLeft;
        const walk = (x - startX) * 1.2;
        track.scrollLeft = scrollLeft - walk;
      });

      // ---- Touch (mobile) swipe ----
      let touchStartX = 0;
      let touchScrollLeft = 0;

      track.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].pageX;
        touchScrollLeft = track.scrollLeft;
      });

      track.addEventListener('touchmove', e => {
        const x = e.touches[0].pageX;
        const walk = (x - touchStartX) * 1.2;
        track.scrollLeft = touchScrollLeft - walk;
      });
    });
  </script>
</body>
</html>
